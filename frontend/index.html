<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hansani Perera, Software Engineer based in Auckland, New Zealand."
    />
    <title>Hansani Perera</title>
    <script>
      // Apply the theme before first paint to avoid a light flash. Mirrors src/hooks/useTheme.ts.
      try {
        const stored = localStorage.getItem('theme');
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
